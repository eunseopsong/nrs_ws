# ros2_mcp_server/config/actions.yaml

actions:
  # ----------------------------------------------------
  # 1. Isaac Sim 로봇 조인트 제어 도구 정의
  # ----------------------------------------------------
  - name: execute_joint_movement
    description: "Move the robot joints to a list of specified target positions. You must specify both the 'joint_names' (strings) and the corresponding 'positions' (floats) to issue a command."
    
    # ros2_mcp_interface에서 제공하는 토픽 발행 인터페이스를 사용합니다.
    interface: ros2_mcp_interface.PublisherInterface 
    
    method: publish
    
    params:
      topic: /isaac_joint_commands
      type: 'sensor_msgs/msg/JointState' # <-- 확인된 정확한 메시지 타입
      
      # Gemini가 자연어에서 추출해야 하는 인자 (JointState 메시지의 필드에 해당)
      # ------------------------------------------------------------
      joint_names:
        type: array
        items:
          type: string
        description: "A list of joint names (strings) to be controlled (e.g., ['joint1', 'joint2']). This list must match the order of the 'positions' array."
        
      positions:
        type: array
        items:
          type: number
        description: "A list of target positions (floats, typically in radians) corresponding to the 'joint_names'."

      # velocity 및 effort는 당장 제어에 필요 없으면 제외하거나 optional로 설정 가능
      # velocity:
      #   type: array
      #   items:
      #     type: number
      #   description: "A list of target velocities for the joints."