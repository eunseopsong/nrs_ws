# ====================================================
# UR10e spindle tool parameters (for Kinematics.cpp)
# 파일 경로: ~/nrs_ws/src/rtde_handarm2/yaml/ur10e_spindle_parameter.yaml
# ====================================================

# ----------------------------------------------------
# 1) TCP (Tool Center Point) 파라미터
#    - EE 기준 EE→TCP 변환 (Ycontact_TCP_pos[0..2] 에 들어갈 값)
#    - tcp_pos[2] = 0.185 로 쓰자고 했던 그 값.
# ----------------------------------------------------
tcp:
  pos: [0.0, 0.0, 0.250]       # [m] EE 프레임에서 TCP까지의 위치 오프셋 (x, y, z)
  rpy: [0.0, 0.0, 0.0]         # [rad] 필요하면 EE→TCP RPY 오프셋 (지금 안 쓰면 0으로 둬도 됨)

# ----------------------------------------------------
# 2) IK 및 수치 안정성 관련 파라미터
#    - ZERO_THRESH: InverseK / Ycontact_InverseK 에서 사용하는 작은 값 비교 기준
#    - singularity_eps: Rotation2EulerAngle 에서 sy < 1e-6 체크에 쓰이는 임계값
# ----------------------------------------------------
numerical:
  zero_thresh: 1.0e-8          # ZERO_THRESH: IK에서 0 비교용 임계값
  singularity_eps: 1.0e-6      # Euler 변환에서 특이점(sy≈0) 판단 기준

# ----------------------------------------------------
# 3) 회전 연속성 관련 옵션 (원하면 튜닝 가능)
#    - R2E_init_flag / R2E_pre_rpy 로 구현된 "2π 래핑" 로직과 연관
# ----------------------------------------------------
rotation_continuity:
  enable_wrap: true            # true이면 2π wrap 최소 거리 선택 로직 유지
  wrap_2pi: true               # 음수 각도일 때 +2π 해서 양수로 시작할지 여부 (지금 코드: roll<0이면 +2π)
